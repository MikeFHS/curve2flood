site_name: Curve2Flood
site_description: Documentation for Curve2Flood, which turns ARC's rating curves into flood maps.
repo_url: https://github.com/MikeFHS/curve2flood
repo_name: MikeFHS/curve2flood

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.footer

docs_dir: docs
site_dir: site

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets:
      base_path: .
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/api.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Overview:
    - Getting Started: getting_started.md
    - Input File: input_file.md
    - Outputs: outputs.md
    - API: api.md
  - Technical Details:
    - Key Concepts: key_concepts.md
    - Kernel-Weighted Mapper: kernel_weighted.md
    - Multi-Point Interpolation Mapper: multi_point.md
    - FLDPLN Mapper: fldpln.md
    - Bathymetry: bathymetry.md
    - Development: development.md
  - License: license.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            filters:
              - "!^_"
            heading_level: 3
            show_signature: true
            # The parameter tables give the types, so the signatures leave them out
            show_signature_annotations: false
            # Each signature in its own code block, one parameter a line (formatted by ruff)
            separate_signature: true
            line_length: 80
            signature_crossrefs: true
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_labels: false
            merge_init_into_class: true
            members_order: source
            annotations_path: brief
            # Config's fields have no docstrings: Input File describes them
            show_if_no_docstring: false
