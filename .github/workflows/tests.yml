name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        # A login shell, so the conda environment is active in every step
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Create the conda environment from environment.yml
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: curve2flood
          python-version: ${{ matrix.python-version }}
          conda-remove-defaults: "true"

      # Every dependency comes from conda, so pip installs Curve2Flood without its dependencies,
      # and pip check fails if environment.yml is missing one that pyproject.toml lists
      - name: Install Curve2Flood
        run: |
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Show the environment
        run: conda list

      - name: Run the tests
        run: python -m pytest -ra

  docs:
    # Builds the documentation as Read the Docs does, failing on any warning, such as a broken link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the documentation
        run: |
          python -m pip install -r docs/requirements.txt
          mkdocs build --strict
